# Publish the messh CLI when a tag like cli-v0.1.0 is pushed: macOS and Linux binaries (amd64, arm64) and
# SHA256SUMS on a GitHub Release, then the Homebrew formula in messhio/homebrew-tap. messh.io's install.sh
# serves the same files. One-time setup (see sdk/PUBLISHING.md): the secret TAP_DEPLOY_KEY, a deploy key
# with write access to messhio/homebrew-tap. Without it the tap step is skipped with a warning.
name: release-cli

on:
  push:
    tags: ["cli-v*"]

permissions:
  contents: write   # create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26", cache-dependency-path: "**/go.sum" }
      - name: test
        working-directory: cli
        run: go vet ./... && go test ./...
      - name: build
        run: |
          v="${GITHUB_REF_NAME#cli-v}"
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "tag must look like cli-v1.2.3"; exit 1; }
          mkdir dist
          for os in linux darwin; do for arch in amd64 arm64; do
            (cd cli && CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$v" -o "../dist/messh-$os-$arch" .)
          done; done
          (cd dist && sha256sum messh-* > SHA256SUMS && cat SHA256SUMS)
      - name: GitHub Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "messh CLI ${GITHUB_REF_NAME#cli-v}" \
            --notes 'Install with `brew install messhio/tap/messh`, or download the binary for your platform and check it against SHA256SUMS.'
      - name: Homebrew formula in messhio/homebrew-tap
        env: { TAP_DEPLOY_KEY: "${{ secrets.TAP_DEPLOY_KEY }}" }
        run: |
          if [ -z "$TAP_DEPLOY_KEY" ]; then
            echo "::warning::TAP_DEPLOY_KEY is not set, so messhio/homebrew-tap was not updated. Write Formula/messh.rb with cli/release/formula.sh and push it by hand (sdk/PUBLISHING.md)."
            exit 0
          fi
          mkdir -p ~/.ssh && printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap && chmod 600 ~/.ssh/tap
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap -o IdentitiesOnly=yes"
          git clone git@github.com:messhio/homebrew-tap.git tap
          mkdir -p tap/Formula
          cli/release/formula.sh "${GITHUB_REF_NAME#cli-v}" dist/SHA256SUMS > tap/Formula/messh.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/messh.rb
          git commit -m "messh ${GITHUB_REF_NAME#cli-v}"
          git push origin HEAD:main
