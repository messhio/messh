# Publish all five SDKs when a tag like sdk-v0.1.0 is pushed, or one registry at a time by hand
# (Actions → release-sdks → Run workflow), for while the others aren't set up yet.
# One-time setup (see sdk/PUBLISHING.md): secrets NPM_TOKEN, CARGO_REGISTRY_TOKEN,
# MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD, MAVEN_GPG_PRIVATE_KEY, MAVEN_GPG_PASSPHRASE;
# PyPI trusted publisher for this workflow (environment "pypi"). Go needs nothing.
name: release-sdks

on:
  push:
    tags: ["sdk-v*"]
  workflow_dispatch:
    inputs:
      registry:
        description: Where to publish the version in the package files
        type: choice
        options: [npm, pypi, crates, maven, go, all]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          # A tag must match every package; a manual run publishes the version they all have.
          if [ "$GITHUB_EVENT_NAME" = push ]; then v=$(./sdk/check-version.sh "${GITHUB_REF_NAME#sdk-v}"); else v=$(./sdk/check-version.sh); fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  test:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: go
        working-directory: sdk/go
        env: { GOWORK: "off" }   # the SDK alone, on its minimum Go, not the repo's go.work
        run: go vet ./... && go test ./...
      - name: python
        working-directory: sdk/py
        run: pip install . "fastapi>=0.100" && python -m unittest discover -s tests
      - name: ts
        working-directory: sdk/ts
        run: npm ci && npm test
      - name: rust
        working-directory: sdk/rs
        run: cargo test --all-features && cargo clippy --all-features --all-targets -- -D warnings
      - name: java
        working-directory: sdk/java
        run: mvn -B test

  npm:
    if: github.event_name == 'push' || inputs.registry == 'all' || inputs.registry == 'npm'
    needs: [version, test]
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }   # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", registry-url: "https://registry.npmjs.org" }
      - working-directory: sdk/ts
        run: |
          [ -n "$NODE_AUTH_TOKEN" ] || { echo "::error::Set the NPM_TOKEN secret: an npm granular access token that can publish to @messh (sdk/PUBLISHING.md)"; exit 1; }
          npm ci && npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    if: github.event_name == 'push' || inputs.registry == 'all' || inputs.registry == 'pypi'
    needs: [version, test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions: { contents: read, id-token: write }   # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - working-directory: sdk/py
        run: pip install build twine && python -m build && twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: sdk/py/dist }

  crates:
    if: github.event_name == 'push' || inputs.registry == 'all' || inputs.registry == 'crates'
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - working-directory: sdk/rs
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  maven:
    if: github.event_name == 'push' || inputs.registry == 'all' || inputs.registry == 'maven'
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - working-directory: sdk/java
        run: mvn -B -P release deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  go:
    # messh.io/go/messh is the sdk/go directory of this repo (the go-import page messh.io serves says so, with
    # Go 1.25's subdirectory field), so a release is the tag sdk/go/vX.Y.Z here.
    if: github.event_name == 'push' || inputs.registry == 'all' || inputs.registry == 'go'
    needs: [version, test]
    runs-on: ubuntu-latest
    permissions: { contents: write }   # push the tag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - name: tag sdk/go/vX.Y.Z
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tag="sdk/go/v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists"
          else
            git tag "$tag" "$GITHUB_SHA" && git push origin "refs/tags/$tag"
          fi
      - name: announce to the Go module proxy
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: GOPROXY=https://proxy.golang.org go list -m "messh.io/go/messh@v$VERSION"
